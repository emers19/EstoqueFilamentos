name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-apk:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Compilar APK de instalação
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar nome amigável do APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/EstoqueFilamentos.apk

      - name: Publicar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: EstoqueFilamentos-APK
          path: dist/EstoqueFilamentos.apk
          if-no-files-found: error
          retention-days: 30
